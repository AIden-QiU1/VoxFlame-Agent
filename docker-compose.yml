# NPM 镜像配置（构建时使用）
x-npm-args: &npm-args
  npm_config_registry: https://registry.npmmirror.com

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  livekit-server:
    image: ${LIVEKIT_SERVER_IMAGE:-docker.m.daocloud.io/livekit/livekit-server:v1.10.1}
    container_name: voxflame-livekit-server
    network_mode: host
    environment:
      - LIVEKIT_SERVER_DEV_MODE=${LIVEKIT_SERVER_DEV_MODE:-1}
      - VOXFLAME_PUBLIC_HOST=${VOXFLAME_PUBLIC_HOST:-}
      # Keep TURN tuning behind VOXFLAME_* names so livekit-server
      # does not auto-interpret partial TURN/TLS env as a native config.
      - VOXFLAME_LIVEKIT_TURN_UDP_PORT=${VOXFLAME_LIVEKIT_TURN_UDP_PORT:-443}
      - VOXFLAME_LIVEKIT_TURN_TLS_PORT=${VOXFLAME_LIVEKIT_TURN_TLS_PORT:-5349}
      - VOXFLAME_LIVEKIT_TURN_TLS_ENABLED=${VOXFLAME_LIVEKIT_TURN_TLS_ENABLED:-0}
      - VOXFLAME_LIVEKIT_TURN_DOMAIN=${VOXFLAME_LIVEKIT_TURN_DOMAIN:-}
    entrypoint:
      - /bin/sh
      - /etc/livekit/start-livekit.sh
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./infra/livekit/livekit.dev.yaml}:/etc/livekit/livekit.yaml:ro
      - ./infra/livekit/start-livekit.sh:/etc/livekit/start-livekit.sh:ro
      - caddy_data:/var/lib/caddy:ro
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 64m
    pids_limit: 128
    logging: *runtime-logging

  frontend:
    image: voxflame-agent-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_PHONE_AUTH_ENABLED: ${NEXT_PUBLIC_PHONE_AUTH_ENABLED:-0}
        NEXT_PUBLIC_API_URL: ${FRONTEND_NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_RTC_EXECUTION_BACKEND: ${NEXT_PUBLIC_RTC_EXECUTION_BACKEND:-livekit}
        NEXT_PUBLIC_ICP_BEIAN_NUMBER: ${NEXT_PUBLIC_ICP_BEIAN_NUMBER:-沪ICP备2026020229号}
        NEXT_PUBLIC_ICP_BEIAN_URL: ${NEXT_PUBLIC_ICP_BEIAN_URL:-https://beian.miit.gov.cn/}
        NEXT_PUBLIC_ICP_BEIAN_COMPANY_NAME: ${NEXT_PUBLIC_ICP_BEIAN_COMPANY_NAME:-上海生声不息科技有限公司}
        NEXT_PUBLIC_ANDROID_APP_DOWNLOAD_URL: ${NEXT_PUBLIC_ANDROID_APP_DOWNLOAD_URL:-}
        NEXT_PUBLIC_IOS_APP_DOWNLOAD_URL: ${NEXT_PUBLIC_IOS_APP_DOWNLOAD_URL:-}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
        VOXFLAME_PUBLIC_BASE_URL: ${VOXFLAME_PUBLIC_BASE_URL:-https://voxember.com}
        <<: *npm-args
    container_name: voxflame-frontend
    ports:
      - "127.0.0.1:3000:3000"   # Caddy-only local HTTP
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:3001
      - VOXFLAME_PUBLIC_BASE_URL=${VOXFLAME_PUBLIC_BASE_URL:-https://voxember.com}
      - NEXT_PUBLIC_RTC_EXECUTION_BACKEND=${NEXT_PUBLIC_RTC_EXECUTION_BACKEND:-livekit}
      - LIVEKIT_SIGNAL_PROXY_TARGET=${LIVEKIT_SIGNAL_PROXY_TARGET:-http://host.docker.internal:7880}
      - npm_config_registry=https://registry.npmmirror.com
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "IP=$$(hostname -I | awk '{print $$1}'); node -e \"require('http').get('http://$$IP:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 256
    logging: *runtime-logging
    networks:
      - voxflame-network

  # Backend API Server
  backend:
    image: voxflame-agent-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        <<: *npm-args
    container_name: voxflame-backend
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - RTC_ENABLE_LIVEKIT_EXPERIMENT=${RTC_ENABLE_LIVEKIT_EXPERIMENT:-1}
      - RTC_DEFAULT_GRAPH=voxflame_voice_assistant_rtc_preview
      - RTC_DEFAULT_TIMEOUT=120
      - LIVEKIT_URL=${LIVEKIT_INTERNAL_URL:-ws://host.docker.internal:7880}
      - LIVEKIT_BROWSER_URL=${LIVEKIT_BROWSER_URL:-ws://localhost:3000}
      - VOXFLAME_PUBLIC_BASE_URL=${VOXFLAME_PUBLIC_BASE_URL:-}
      - VOXFLAME_ALLOWED_ORIGINS=${VOXFLAME_ALLOWED_ORIGINS:-https://voxember.com}
      - VOXFLAME_JSON_BODY_LIMIT=${VOXFLAME_JSON_BODY_LIMIT:-1mb}
      - VOXFLAME_WEBHOOK_CONVERSATION_ENABLED=${VOXFLAME_WEBHOOK_CONVERSATION_ENABLED:-0}
      - VOXFLAME_WEBHOOK_CONVERSATION_SECRET=${VOXFLAME_WEBHOOK_CONVERSATION_SECRET:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-voxflame_livekit_dev_secret_32chars}
      - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME:-voxflame-agent}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DASHSCOPE_MEMORY_MAINTENANCE_MODEL=${DASHSCOPE_MEMORY_MAINTENANCE_MODEL:-qwen3.5-plus}
      - DASHSCOPE_MEMORY_MAINTENANCE_TIMEOUT_SECONDS=${DASHSCOPE_MEMORY_MAINTENANCE_TIMEOUT_SECONDS:-12}
      - DASHSCOPE_TRAINING_REPORT_MODEL=${DASHSCOPE_TRAINING_REPORT_MODEL:-qwen3.5-plus}
      - DASHSCOPE_TRAINING_REPORT_TIMEOUT_SECONDS=${DASHSCOPE_TRAINING_REPORT_TIMEOUT_SECONDS:-12}
      - DASHSCOPE_PREPARED_EXPRESSION_SUMMARY_TIMEOUT_SECONDS=${DASHSCOPE_PREPARED_EXPRESSION_SUMMARY_TIMEOUT_SECONDS:-12}
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - livekit-server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 128m
    pids_limit: 256
    logging: *runtime-logging
    networks:
      - voxflame-network

  livekit-agent:
    image: voxflame-agent-livekit-agent:latest
    build:
      context: ./livekit_agent
      dockerfile: ${LIVEKIT_AGENT_DOCKERFILE:-Dockerfile}
      args:
        LIVEKIT_AGENT_BASE_IMAGE: ${LIVEKIT_AGENT_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.10-slim}
        LIVEKIT_AGENT_BOOTSTRAP_DEPS: ${LIVEKIT_AGENT_BOOTSTRAP_DEPS:-1}
        LIVEKIT_AGENT_PIP_INDEX_URL: ${LIVEKIT_AGENT_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        LIVEKIT_AGENT_PIP_EXTRA_INDEX_URL: ${LIVEKIT_AGENT_PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./livekit_agent/.env
    container_name: voxflame-livekit-agent
    environment:
      - LIVEKIT_URL=${LIVEKIT_DOCKER_URL:-ws://127.0.0.1:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-voxflame_livekit_dev_secret_32chars}
      - LIVEKIT_AGENT_NAME=${LIVEKIT_AGENT_NAME:-voxflame-agent}
      - VOXFLAME_LIVEKIT_AGENT_MODE=${VOXFLAME_LIVEKIT_AGENT_MODE:-communication_stub}
      - LOG_LEVEL=${LIVEKIT_AGENT_LOG_LEVEL:-info}
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - NO_PROXY=127.0.0.1,localhost,livekit-server
      - no_proxy=127.0.0.1,localhost,livekit-server
      - DASHSCOPE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - DASHSCOPE_TIMEOUT_SECONDS=15
      - QWEN_HTTP_ASR_URL=${QWEN_HTTP_ASR_URL:-http://127.0.0.1:8001/transcribe}
      - QWEN_HTTP_ASR_LANGUAGE=${QWEN_HTTP_ASR_LANGUAGE:-Chinese}
      - QWEN_HTTP_ASR_TIMEOUT_SECONDS=${QWEN_HTTP_ASR_TIMEOUT_SECONDS:-30}
    depends_on:
      - livekit-server
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    logging: *runtime-logging
    network_mode: host

  caddy:
    image: docker.m.daocloud.io/library/caddy:2.10.2-alpine
    container_name: voxflame-caddy
    profiles:
      - https
    network_mode: host
    environment:
      - VOXFLAME_PUBLIC_HOST=${VOXFLAME_PUBLIC_HOST:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VOXFLAME_ANDROID_RELEASE_DIR:-./releases/android}:/srv/releases/android:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 32m
    pids_limit: 128
    logging: *runtime-logging

  # Qdrant (向量数据库 - 可选)
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    container_name: voxflame-qdrant
    profiles:
      - extras
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-voxflame_secret_key}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - voxflame-network

  # Redis (缓存与会话状态)
  redis:
    image: docker.m.daocloud.io/library/redis:alpine
    container_name: voxflame-redis
    profiles:
      - extras
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-voxflame_redis_secret} --appendonly yes
    restart: unless-stopped
    networks:
      - voxflame-network

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local

networks:
  voxflame-network:
    driver: bridge
