      - paragraph [ref=f1e36]:
        - link "Enroll in the program with the Apple Developer app " [ref=f1e37] [cursor=pointer]:
          - /url: /support/app-account/
          - text: Enroll in the program with the
          - generic [ref=f1e38]: Apple Developer app 
      - generic [ref=f1e42]:
        - heading "Become a member" [level=1] [ref=f1e43]
        - paragraph [ref=f1e44]: To become an Apple Developer Program member, you can enroll as an individual or enroll your organization. Learn about what you’ll need and the requirements to enroll.
        - paragraph [ref=f1e45]:
          - link "Start your enrollment" [ref=f1e46] [cursor=pointer]:
            - /url: /register/agree/?source=programs_enroll_start_enrollment&path=%2Fenroll%2F
      - generic [ref=f1e50]:
        - heading "Enrolling as an individual" [level=2] [ref=f1e51]
        - paragraph [ref=f1e53]:
          - text: If you’re an individual or sole proprietor/single person business, you’ll need an Apple Account with
          - link "two-factor authentication" [ref=f1e55] [cursor=pointer]:
            - /url: https://support.apple.com/en-us/HT204915/
          - text: turned on and be the legal age* of majority in your region. Make sure to use your legal name in the first and last name fields of your Apple Account. Using an alias, nickname, or company name as your first or last name will cause a delay in the approval of your enrollment.
        - paragraph [ref=f1e56]: "During the the enrollment process, we’ll confirm the following:"
        - list [ref=f1e57]:
          - listitem [ref=f1e58]:
            - strong [ref=f1e59]: Legal name.
            - text: Your personal legal name is needed so that you can enter into contracts with Apple. Your name will be displayed as the seller name of your apps on the App Store.
          - listitem [ref=f1e60]:
            - strong [ref=f1e61]: Email, phone, and address.
            - text: P.O. boxes are not accepted.
      - generic [ref=f1e65]:
        - heading "Enrolling your organization" [level=2] [ref=f1e66]
        - paragraph [ref=f1e68]:
          - text: If you’re enrolling your organization, you’ll need an Apple Account with
          - link "two-factor authentication" [ref=f1e69] [cursor=pointer]:
            - /url: https://support.apple.com/en-us/HT204915/
          - text: turned on. We recommend that your Apple Account uses your email address from your organization. Make sure both your first and last names are your legal names. Using an alias, nickname, or company name as your first or last name will cause a delay in the approval of your enrollment.
        - paragraph [ref=f1e70]: "During the the enrollment process, we’ll confirm the following:"
        - list [ref=f1e71]:
          - listitem [ref=f1e72]:
            - strong [ref=f1e73]: Legal binding authority.
            - text: As the person enrolling your organization in the Apple Developer Program, you’ll be the Account Holder and must have the legal authority to bind your organization to legal agreements. You must be the organization’s owner/founder, executive team member, senior project lead, or an employee with legal authority granted to you by a senior employee.
          - listitem [ref=f1e74]:
            - strong [ref=f1e75]: Legal entity name and status.
            - text: Your organization must be a legal entity that can enter into contracts with Apple. We do not accept DBAs, fictitious business names, trade names, or branches. Your organization’s name will be displayed as the seller name of your apps on the App Store.
          - listitem [ref=f1e76]:
            - strong [ref=f1e77]: D-U-N-S Number.
            - text: Your organization (excluding government entities) must have a
            - link "D-U-N-S Number" [ref=f1e78] [cursor=pointer]:
              - /url: /support/D-U-N-S/
            - text: so that we can verify your organization’s identity, legal entity status, and address. These unique nine-digit numbers are assigned by Dun & Bradstreet and are widely used as standard business identifiers. You can check to see if your organization already has a D-U-N-S Number and request one if necessary.
          - listitem [ref=f1e79]:
            - strong [ref=f1e80]: Phone and Email.
            - text: Your work email address needs to associated with your organization’s domain name.
          - listitem [ref=f1e81]:
            - strong [ref=f1e82]: Website.
            - text: Your organization’s website must be publicly available and functional, and its domain name must be associated with your organization. Links to social media webpages or websites that contain minimal content or display a message from a domain registrar won’t be accepted.
      - generic [ref=f1e86]:
        - heading "Terms and payment" [level=2] [ref=f1e87]
        - paragraph [ref=f1e88]:
          - text: Once your enrollment information has been verified, you’ll need to agree to the
          - link "Apple Developer Program License Agreement" [ref=f1e89] [cursor=pointer]:
            - /url: /support/terms/apple-developer-program-license-agreement/
          - text: and complete your membership purchase. The Apple Developer Program is 99 USD per membership year. Prices may vary by region and are listed in local currency during the enrollment process. If you’re a nonprofit organization, accredited educational institution, or government entity and meet certain requirements, you can request a
          - link "fee waiver" [ref=f1e90] [cursor=pointer]:
            - /url: /support/fee-waiver/
          - text: .
        - paragraph [ref=f1e91]: Apple is committed to the privacy and security of your information. We collect only the data needed to enable developers to be successful on Apple platforms and to provide a safe experience for users.
        - paragraph [ref=f1e92]:
          - link "Learn how your data is managed " [ref=f1e93] [cursor=pointer]:
            - /url: /support/privacy/
