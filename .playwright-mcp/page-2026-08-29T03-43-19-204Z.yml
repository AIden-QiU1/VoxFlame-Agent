      - generic [ref=e1590]:
        - heading "5 Conclusions" [level=2] [ref=e1591]:
          - generic [ref=e1592]: "5"
          - text: Conclusions
        - paragraph [ref=e1594]: This paper explores two aggregation strategies in federated learning to achieve personalization for dysarthric speech recognition. These two strategies include the parameter-based and embedding-based averaging strategies. Experiments on UASpeech and TORGO demonstrate the effectiveness. Future research will focus on aggregation strategies for elderly speech.
