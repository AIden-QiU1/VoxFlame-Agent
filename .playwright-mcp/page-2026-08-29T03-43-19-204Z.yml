              - text: "]"
            - text: "is the largest publicly available and widely used dataset for dysarthric speech recognition. It comprises an isolated word recognition task with approximately 103 hours of speech data from 29 speakers, among whom 16 are dysarthric speakers and 13 are healthy control speakers. The dataset includes 155 common words and 300 uncommon words and is further divided into three blocks B1, B2 and B3. The same 155 common words are used across all blocks, while the 300 uncommon words differ between blocks. In our experiments, we focus on the 16 dysarthric speakers and exclude the healthy control speakers. B1 and B3 are used for training, while B2 is used for evaluation. After removing silence, the training set and the test set contain 17.8 hours (52785 utterances) and 9 hours of audio (26520 utterances) in total, respectively. Speech intelligibility assessment is available for the 16 dysarthric speakers, divided into four groups: “very low” (VL), “low” (L), “mid” (M) and “high” (H)."
