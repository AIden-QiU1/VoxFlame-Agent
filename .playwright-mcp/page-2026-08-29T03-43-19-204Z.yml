              - text: "]"
            - text: .
        - paragraph [ref=e109]:
          - generic [ref=e110]:
            - text: Model aggregation lies at the core of federated learning, where local models are integrated into a global model. Widely adopted methods like FedAvg
            - generic [ref=e111]:
              - text: "["
              - link "13" [ref=e112] [cursor=pointer]:
                - /url: "#bib.bib3"
              - text: "]"
            - text: utilize a quantity-based averaging strategy, weighting client model updates by the proportion of data samples contributed by each client. For speech-related tasks, integration of task-specific knowledge has been explored in
            - generic [ref=e113]:
              - text: "["
              - link "25" [ref=e114] [cursor=pointer]:
                - /url: "#bib.bib18"
              - text: "]"
            - text: ", where word error rate (WER) based aggregation is proposed."
          - generic [ref=e115]: However, the substantial heterogeneity among dysarthric speakers suggests that a single global model may not effectively model all speakers
          - text: ", and adding personalization"
          - generic [ref=e116]:
            - text: "["
            - link "28" [ref=e117] [cursor=pointer]:
              - /url: "#bib.bib35"
            - text: ","
            - link "32" [ref=e118] [cursor=pointer]:
              - /url: "#bib.bib40"
            - text: ","
            - link "8" [ref=e119] [cursor=pointer]:
              - /url: "#bib.bib5"
            - text: ","
            - link "33" [ref=e120] [cursor=pointer]:
              - /url: "#bib.bib41"
            - text: "]"
          - text: is a direction to tackle the above issues and the related research on dysarthric speech is limited and needs exploration.
        - paragraph [ref=e122]:
          - text: To this end, this paper proposes two novel model aggregation strategies targeting personalized federated learning for dysarthric speech recognition. Specifically, the model is divided into a speaker-independent (SI) component and a speaker-dependent (SD) component.
          - generic [ref=e123]: "For the SI part, standard FedAvg is employed for averaging. For the SD part, two similarity-based averaging strategies are introduced: (1) parameter-based averaging, which computes speaker similarities based on model parameters; and (2) embedding-based averaging, which calculates speaker similarities using output embeddings from the SI component. In order to improve privacy protection, we calculate client embeddings using a random subset of private data in each communication. These speaker similarities are then used to guide the averaging process of the SD model component, enabling personalized models tailored to individual dysarthric speakers."
          - text: "Performance evaluation is conducted on two benchmark healthcare datasets: 1) UASpeech"
          - generic [ref=e124]:
            - text: "["
            - link "34" [ref=e125] [cursor=pointer]:
              - /url: "#bib.bib6"
            - text: "]"
          - text: dysarthric speech corpus; and 2) TORGO
          - generic [ref=e126]:
            - text: "["
            - link "35" [ref=e127] [cursor=pointer]:
              - /url: "#bib.bib7"
            - text: "]"
          - text: dysarthric speech corpus.
        - paragraph [ref=e129]: "The main contributions of this paper are as follows:"
        - paragraph [ref=e131]:
          - text: 1) To the best of our knowledge, this is the first work on personalized federated learning for dysarthric speech recognition. We propose two similarity-aware aggregation strategies that personalize FedAvg using inter-speaker similarity. Prior personalized FL studies focus on normal speech
          - generic [ref=e132]:
            - text: "["
            - link "28" [ref=e133] [cursor=pointer]:
              - /url: "#bib.bib35"
            - text: ","
            - link "33" [ref=e134] [cursor=pointer]:
              - /url: "#bib.bib41"
            - text: ","
            - link "36" [ref=e135] [cursor=pointer]:
              - /url: "#bib.bib43"
            - text: "]"
          - text: . Compared with
          - generic [ref=e136]:
            - text: "["
            - link "28" [ref=e137] [cursor=pointer]:
              - /url: "#bib.bib35"
            - text: "]"
          - text: ", which personalizes via k-nearest neighbors, we achieve personalization through similarity-weighted aggregation. Moreover, we build on the large pretrained HuBERT model rather than a Conformer backbone as in"
          - generic [ref=e138]:
            - text: "["
            - link "33" [ref=e139] [cursor=pointer]:
              - /url: "#bib.bib41"
            - text: "]"
          - text: . Unlike
          - generic [ref=e140]:
            - text: "["
            - link "36" [ref=e141] [cursor=pointer]:
              - /url: "#bib.bib43"
            - text: "]"
          - text: ", which risks poor initialization due to the averaging of conflicting gradients from speaker heterogeneity and relies on isolated client fine-tuning, our approach actively pulls updates toward clinically relevant speaker neighbors to minimize the negative interference of unrelated dysarthric speech patterns."
        - paragraph [ref=e143]: 2) Experiments on the benchmark UASpeech and TORGO datasets show statistically significant WER reductions of up to 0.99% absolute (3.15% relative) and 0.56% absolute (4.73% relative), compared with a regularized FedAvg baseline.
        - paragraph [ref=e145]:
