            - text: is a dysarthric speech dataset containing 8 dysarthric and 7 control healthy speakers with 13.5 hours of speech (16433 utterances). The entire TORGO dataset contains 1573 distinct words. Similar to the setting in UASpeech, in our experiments, we focus on the 8 dysarthric speakers and exclude the healthy control speakers, and we put two-thirds of the dysarthric speakers’ data into the training set. The remaining one-third of the dysarthric speech is used for performance evaluation
