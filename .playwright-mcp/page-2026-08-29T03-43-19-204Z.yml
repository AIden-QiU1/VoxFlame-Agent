              - text: "]"
            - text: .
          - text: "Dysarthric speech presents multi-fold challenges for current deep learning-based ASR systems primarily targeting healthy users, including: 1) substantial mismatch between this data and normal voices; 2) data scarcity resulting from the difficulties associated with data collection, frequently constrained by speakers’ mobility limitations"
          - generic [ref=e71]:
            - text: "["
            - link "7" [ref=e72] [cursor=pointer]:
              - /url: "#bib.bib2"
            - text: "]"
          - text: ; and 3) large speaker heterogeneity , where variations in accent and gender are further exacerbated by speech impairments. Given the high priority of privacy concerns in healthcare among dysarthric speakers, there has been a growing shift towards decentralized training over centralized approaches
          - generic [ref=e73]:
            - text: "["
            - link "12" [ref=e74] [cursor=pointer]:
