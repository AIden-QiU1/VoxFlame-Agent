purpose: >-
  最小专家雷达。只收少量身份清楚、长期有一手产出的作者；新账号先按单次问题临时核验，
  不为了“覆盖中外社媒”批量收录。
rules:
  - 社媒/博客是 radar，不是 evidence；重要观点必须绑定论文、标准、官方文档、代码或机构页面
  - 记录作者主页、机构关系、专业范围、发布日期和利益关系
  - 找不到一手回溯或账号身份不清，降级为临时线索，不进入默认抓取
