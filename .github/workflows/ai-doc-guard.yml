name: AI Governance Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-ai-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AI documentation harness
        run: bash scripts/check_ai_docs.sh

      - name: Validate AI governance guardrails
        run: bash scripts/check_ai_governance.sh
